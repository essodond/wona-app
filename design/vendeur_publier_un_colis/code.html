<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WONA - Publication de colis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#eee0d3",
                    "tertiary-container": "#00a0ea",
                    "on-tertiary": "#ffffff",
                    "surface-container-highest": "#f3dfd4",
                    "on-tertiary-fixed-variant": "#004b71",
                    "on-primary-fixed": "#311300",
                    "on-tertiary-fixed": "#001e30",
                    "tertiary": "#006494",
                    "on-secondary-fixed": "#211a12",
                    "inverse-surface": "#3a2e27",
                    "on-error-container": "#93000a",
                    "surface-variant": "#f3dfd4",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#4f2300",
                    "primary-fixed-dim": "#ffb688",
                    "on-secondary-fixed-variant": "#4e453b",
                    "error": "#ba1a1a",
                    "primary": "#974800",
                    "primary-container": "#e8791e",
                    "tertiary-fixed": "#cbe6ff",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#fff8f5",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#ffede4",
                    "on-primary-fixed-variant": "#733600",

                    "secondary": "#665d52",
                    "surface-tint": "#974800",
                    "on-background": "#241913",
                    "surface-dim": "#ead6cc",

                    "tertiary-fixed-dim": "#8fcdff",
                    "background": "#fff8f5",
                    "outline-variant": "#ddc1b1",
                    "secondary-container": "#ebddd0",
                    "surface-bright": "#fff8f5",
                    "inverse-primary": "#ffb688",
                    "primary-fixed": "#ffdbc7",
                    "secondary-fixed-dim": "#d1c4b7",
                    "on-surface-variant": "#564337",
                    "surface-container-low": "#fff1ea",
                    "on-primary": "#ffffff",
                    "on-tertiary-container": "#00334e",
                    "surface-container-high": "#f9e4d9",
                    "outline": "#8a7265",
                    "on-surface": "#241913",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "20px",
                    "md": "16px",
                    "stack-gap": "12px",
                    "xl": "32px",
                    "sm": "12px",
                    "xs": "8px",
                    "lg": "24px",
                    "base": "4px"
            },
            "fontFamily": {
                    "headline-lg": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "headline-md": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "label-bold": ["Be Vietnam Pro"],

                    "headline-lg-mobile": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-bold": ["12px", {"lineHeight": "16px", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fff8f5;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-effect:focus-within {
            border-color: #e8791e;
            box-shadow: 0 0 0 1px #e8791e;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center justify-between px-container-padding py-md">
<div class="flex items-center gap-4">
<button aria-label="Retour" class="active:scale-95 transition-transform hover:opacity-80 flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined text-primary text-[28px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">Publier un colis</h1>
</div>
<div class="flex items-center">
<span class="font-headline-md text-headline-md text-primary">WONA</span>
</div>
</header>
<main class="flex-1 px-container-padding pt-6 pb-32 max-w-lg mx-auto w-full">
<!-- Progress Steps -->
<div class="mb-8 flex items-center justify-between">
<div class="flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold">1</div>
<span class="font-label-md text-label-md text-on-surface">Détails</span>
</div>
<div class="flex-1 h-0.5 bg-surface-container-highest mx-2 mb-6"></div>
<div class="flex flex-col items-center gap-2 opacity-40">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold">2</div>
<span class="font-label-md text-label-md text-on-surface">Paiement</span>
</div>
<div class="flex-1 h-0.5 bg-surface-container-highest mx-2 mb-6"></div>
<div class="flex flex-col items-center gap-2 opacity-40">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold">3</div>
<span class="font-label-md text-label-md text-on-surface">Confirmation</span>
</div>
</div>
<form class="space-y-stack-gap">
<!-- Delivery Info Card -->
<section class="bg-surface-container-low p-md rounded-xl space-y-4">
<h2 class="font-headline-md text-headline-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary">route</span>
                    Trajet
                </h2>
<div class="space-y-3">
<div class="relative group">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1 ml-1">Récupération</label>
<div class="flex items-center bg-surface border border-outline/20 rounded-lg p-3 input-focus-effect transition-all">
<span class="material-symbols-outlined text-primary mr-3">my_location</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="D'où part le colis ?" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1 ml-1">Livraison</label>
<div class="flex items-center bg-surface border border-outline/20 rounded-lg p-3 input-focus-effect transition-all">
<span class="material-symbols-outlined text-error mr-3">location_on</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="Où va le colis ?" type="text"/>
</div>
</div>
</div>
</section>
<!-- Description Card -->
<section class="bg-surface-container-low p-md rounded-xl space-y-4">
<h2 class="font-headline-md text-headline-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary">description</span>
                    Description
                </h2>
<div class="relative group">
<textarea class="w-full bg-surface border border-outline/20 rounded-lg p-3 focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-on-surface placeholder:text-outline-variant transition-all" placeholder="Que transportez-vous ? (ex: Documents, Vêtements...)" rows="3"></textarea>
</div>
</section>
<!-- Specs Bento Grid-ish Layout -->
<div class="grid grid-cols-2 gap-3">
<section class="bg-surface-container-low p-md rounded-xl space-y-3">
<h2 class="font-label-bold text-label-bold text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">straighten</span>
                        Taille / Poids
                    </h2>
<select class="w-full bg-surface border border-outline/20 rounded-lg p-3 font-body-md text-on-surface focus:border-primary-container focus:ring-0 transition-all appearance-none cursor-pointer">
<option>Petit ( &lt; 1kg)</option>
<option>Moyen (1-5kg)</option>
<option>Grand (5-15kg)</option>
<option>Très Grand (+15kg)</option>
</select>
</section>
<section class="bg-surface-container-low p-md rounded-xl space-y-3">
<h2 class="font-label-bold text-label-bold text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">payments</span>
                        Prix proposé
                    </h2>
<div class="flex items-center bg-surface border border-outline/20 rounded-lg p-3 input-focus-effect transition-all">
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="500" type="number"/>
<span class="font-label-bold text-on-surface-variant ml-2">FCFA</span>
</div>
</section>
</div>
<!-- Optional Visual Content -->
<div class="w-full h-32 relative rounded-xl overflow-hidden mt-4 group cursor-pointer">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="A cinematic, high-quality photograph of a modern logistics center in West Africa at golden hour. Warm orange sunlight filters through large windows, illuminating a clean, organized space with cardboard packages and professional delivery equipment. The atmosphere is reliable, professional, and efficient, reflecting the corporate modern style of the WONA delivery service." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuABz9VjY6k6il5tXbAiiAC2fzWpjBVgfWZ8w7RAPS0ZDjBG7pm4IraSrd_2c52Bpqs_4gn_GfyiC5IN5QYkg16ttoJNY1RfrZLYq2_GukmjofJOArGwVLc14AKn4MslEtsvPrTbOGfdk510V2lHDcp6mcyPQOLAwezQR0k2qtGqi_UQWDxlJ9of5Mu91-Ypjvjxfdo4_-rgh8PCL-5a7P9D-WOtA8aeTQDlIz4UEJnP-sqO9G_lb_YH')"></div>
<div class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center text-white">
<span class="material-symbols-outlined text-3xl mb-1">add_a_photo</span>
<span class="font-label-md text-label-md">Ajouter une photo du colis</span>
</div>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 right-0 p-container-padding bg-surface/80 backdrop-blur-md z-40 border-t border-outline-variant/10">
<div class="max-w-lg mx-auto">
<button class="w-full h-14 bg-primary-container text-on-primary-container rounded-full font-headline-md shadow-lg active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                Publier l'annonce
            </button>
<p class="text-center mt-3 font-label-md text-on-surface-variant opacity-60">
                En publiant, vous acceptez nos conditions générales.
            </p>
</div>
</div>
<!-- Hidden padding to ensure content doesn't get cut off by fixed button -->
<div class="h-24 md:hidden"></div>
<script>
        // Micro-interactions for form inputs
        document.querySelectorAll('input, textarea, select').forEach(el => {
            el.addEventListener('focus', () => {
                el.closest('section').classList.add('ring-1', 'ring-primary-container/20');
            });
            el.addEventListener('blur', () => {
                el.closest('section').classList.remove('ring-1', 'ring-primary-container/20');
            });
        });

        // Simple validation mock
        const publishBtn = document.querySelector('button.bg-primary-container');
        publishBtn.addEventListener('click', (e) => {
            e.preventDefault();
            publishBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Publication...';
            setTimeout(() => {
                publishBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Publié avec succès';
                publishBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
            }, 1500);
        });
    </script>
</body></html>
