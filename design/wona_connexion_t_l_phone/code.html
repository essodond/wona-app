<!-- Async Interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.querySelector('input[type="tel"]');
            const button = document.querySelector('button.bg-primary-container');

            // Simple formatting for the phone number
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 10) value = value.slice(0, 10);
                
                // Add visual spacing
                let formatted = "";
                for (let i = 0; i < value.length; i++) {
                    if (i > 0 && i % 2 === 0) formatted += " ";
                    formatted += value[i];
                }
                e.target.value = formatted;
                
                // Active state for button
                if (value.length === 10) {
                    button.classList.remove('opacity-50');
                } else {
                    button.classList.add('opacity-50');
                }
            });

            // Initial button state
            button.classList.add('opacity-50');
            
            // Interaction feedback
            button.addEventListener('click', () => {
                if(input.value.replace(/\D/g, '').length === 10) {
                    button.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                    setTimeout(() => {
                        button.innerHTML = 'Recevoir le code <span class="material-symbols-outlined">chevron_right</span>';
                    }, 2000);
                }
            });
        });
    </script>
