<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fff8f5;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Entrance Animations */
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes logo-pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes line-draw {
            0% { width: 0%; left: 50%; opacity: 0; }
            100% { width: 40px; left: calc(50% - 20px); opacity: 1; }
        }

        .animate-fade-up {
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-logo {
            animation: logo-pulse 3s ease-in-out infinite;
        }

        .loading-line {
            position: absolute;
            bottom: 48px;
            height: 3px;
            background-color: #e8791e;
            border-radius: 99px;
            animation: line-draw 1.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative">
<!-- Splash Content Wrapper -->
<main class="flex flex-col items-center justify-center w-full px-container-padding animate-fade-up">

<div class="relative flex flex-col items-center gap-base mb-xl">

<span class="material-symbols-outlined text-on-primary text-[56px]" style="font-variation-settings: 'FILL' 1;">
                    moped

            </h1>
</div>
<!-- Tagline / Mission -->
<p class="font-body-md text-body-md text-secondary text-center max-w-[200px] opacity-80">
            Logistique urbaine rapide &amp; sécurisée
        </p>
</main>
<!-- Animated Loading Element -->

<!-- JS for simulated redirect or interaction -->
<script>
        // Simulate a transition after 3 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease-out';
                document.body.style.opacity = '0';
                // In a real app, this would trigger navigation
                console.log('Transition to Dashboard/Home...');
            }, 3000);
        });

        // Add a small hover interaction to the logo for desktop
        const logo = document.querySelector('.animate-logo');
        if (logo) {
            logo.addEventListener('mouseenter', () => {
                logo.style.transform = 'scale(1.1) rotate(5deg)';
                logo.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            });
            logo.addEventListener('mouseleave', () => {
                logo.style.transform = 'scale(1) rotate(0deg)';
            });
        }
    </script>
