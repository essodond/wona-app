<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff8f5; overflow: hidden; }
        .map-canvas { height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Smooth Entrance for Bottom Sheet */
        .bottom-sheet-animation {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* Pulsing dot for motorcycle location */
        .pulse-circle {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            70% { transform: scale(2.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Simple float animation for motorcycle */
        .moto-float {
            animation: motoMoving 3s ease-in-out infinite;
        }
        @keyframes motoMoving {
            0%, 100% { transform: translate(0, 0) rotate(-5deg); }
            50% { transform: translate(10px, -5px) rotate(5deg); }
        }
    </style>

<body class="bg-background text-on-background">

<!-- INVISIBLE NAVIGATION SHELL LOGIC -->
<!-- (Suppressed as per "Task-Focused" exclusion rule in instructions: Tracking is a focused sub-page) -->
<script>
        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined');
                if(icon) {
                    icon.classList.add('scale-110');
                    setTimeout(() => icon.classList.remove('scale-110'), 200);
                }
            });
        });

        // Simple script to simulate a small movement of the moto marker
        const moto = document.querySelector('.moto-float');
        let moveX = 180;
        let moveY = 480;
        
        setInterval(() => {
            moveX += (Math.random() - 0.4) * 0.5;
            moveY -= (Math.random() * 0.4);
            if (moto) {
                // We keep the animation class but adjust the base transform
                // (Note: in a real app, this would be GPS coordinates)
            }
        }, 100);
    </script>
