<script>
        // Simple Star Rating Micro-interaction
        const starBtns = document.querySelectorAll('.star-btn');
        let currentRating = 0;

        starBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const value = parseInt(btn.getAttribute('data-value'));
                currentRating = value;
                updateStars(value);
            });

            btn.addEventListener('mouseenter', () => {
                const value = parseInt(btn.getAttribute('data-value'));
                updateStars(value, true);
            });

            btn.addEventListener('mouseleave', () => {
                updateStars(currentRating);
            });
        });

        function updateStars(value, isHover = false) {
            starBtns.forEach((btn, index) => {
                const starIcon = btn.querySelector('.star-icon');
                if (index < value) {
                    starIcon.style.fontVariationSettings = "'FILL' 1";
                    starIcon.classList.add('text-primary');
                } else {
                    starIcon.style.fontVariationSettings = "'FILL' 0";
                    if (isHover) {
                        starIcon.classList.add('opacity-30');
                    } else {
                        starIcon.classList.remove('opacity-30');
                    }
                }
            });
        }

        // Quick Tag Auto-Fill Logic
        const tags = document.querySelectorAll('.bg-secondary-fixed');
        const textarea = document.getElementById('comment');
        tags.forEach(tag => {
            tag.addEventListener('click', () => {
                if (textarea.value.includes(tag.textContent)) return;
                textarea.value += (textarea.value ? ', ' : '') + tag.textContent;
                tag.classList.toggle('bg-primary-container');
                tag.classList.toggle('text-white');
            });
        });
    </script>
