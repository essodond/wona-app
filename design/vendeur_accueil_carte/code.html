<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-container {
            height: calc(100vh - 64px);
        }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-background overflow-hidden">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center justify-between px-container-padding py-md">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform cursor-pointer" data-icon="arrow_back">arrow_back</span>
<h1 class="font-headline-md text-headline-md-mobile text-primary">WONA</h1>
</div>
<div class="flex gap-4">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</div>
</header>
<main class="relative w-full map-container">
<!-- Full Screen Map View -->
<div class="absolute inset-0 z-0 bg-surface-dim" data-location="Abidjan, Ivory Coast" style="">
<!-- Simulated Map Component -->
<div class="w-full h-full relative overflow-hidden bg-cover bg-center" data-alt="A detailed map of a bustling West African city like Abidjan with clean, minimalist styling. The map features warm, high-quality cartography with clearly defined streets and boulevards. The lighting is bright and sunny, reflecting a vibrant urban daytime atmosphere. The visual aesthetic is modern and professional, with a corporate yet friendly color palette dominated by whites, soft oranges, and subtle greys." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD5uqGG58Rh7pKmX8Azsj5xFdAwhxEzl2IxCXGACEZVw6hpX3IoW7A2c5hhg-079ez-EoVQgM9gAAYmdOR9xwr259FjLoLkY7ImLPqHygA2KVqaBQRO1WV9-_87FdRMFVP3_VPZWSnY9F66hUKs3fNLrrGxsTAMrMPhZlxYaLd1W9Bwx7wpv2o8Q-zEX-pwJXOhgkvdIcuh5f7x_kd5ZX92jbr7r0_8dL295kpFluHx5RlFzBvapvXU')">
<!-- Floating Delivery Markers (Orange Points) -->
<div class="absolute top-[30%] left-[40%] animate-bounce">
<div class="w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg border-2 border-white">
<span class="material-symbols-outlined text-[20px]" data-icon="local_shipping" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
</div>
<div class="absolute top-[55%] left-[25%] animate-pulse">
<div class="w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg border-2 border-white">
<span class="material-symbols-outlined text-[20px]" data-icon="local_shipping" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
</div>
<div class="absolute top-[40%] right-[30%]">
<div class="w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg border-2 border-white">
<span class="material-symbols-outlined text-[20px]" data-icon="local_shipping" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
</div>
<div class="absolute bottom-[40%] left-[60%]">
<div class="w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg border-2 border-white">
<span class="material-symbols-outlined text-[20px]" data-icon="local_shipping" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
</div>
</div>
</div>
<!-- Search Bar Overlay -->
<div class="absolute top-4 left-0 right-0 px-container-padding z-10">
<div class="w-full bg-surface rounded-xl shadow-lg border border-outline-variant flex items-center px-4 py-3 gap-3">
<span class="material-symbols-outlined text-outline" data-icon="search">search</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="Où envoyer votre colis ?" type="text"/>
<div class="h-6 w-[1px] bg-outline-variant mx-1"></div>
<span class="material-symbols-outlined text-primary" data-icon="my_location">my_location</span>
</div>
</div>
<!-- Floating Action Button -->
<div class="absolute bottom-24 right-container-padding z-20 fade-in">
<button class="bg-primary-container text-on-primary-container flex items-center gap-3 px-6 py-4 rounded-full shadow-[0px_4px_12px_rgba(232,121,30,0.4)] active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined font-bold" data-icon="add">add</span>
<span class="font-label-bold text-label-md uppercase tracking-wide">Publier un colis</span>
</button>
</div>
<!-- Quick Access Category Chips -->
<div class="absolute bottom-24 left-0 right-0 px-container-padding z-10 flex gap-2 overflow-x-auto no-scrollbar pointer-events-none md:pointer-events-auto">
<div class="pointer-events-auto bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant/30 flex items-center gap-2 shadow-sm whitespace-nowrap">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="restaurant">restaurant</span>
<span class="font-label-md text-on-surface">Nourriture</span>
</div>
<div class="pointer-events-auto bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant/30 flex items-center gap-2 shadow-sm whitespace-nowrap">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="shopping_bag">shopping_bag</span>
<span class="font-label-md text-on-surface">Boutique</span>
</div>
<div class="pointer-events-auto bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant/30 flex items-center gap-2 shadow-sm whitespace-nowrap">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="medical_services">medical_services</span>
<span class="font-label-md text-on-surface">Pharmacie</span>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full rounded-t-xl z-50 bg-surface shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] flex justify-around items-center h-16 w-full px-4">
<!-- Active Tab: Accueil -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-all duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md">Accueil</span>
</div>
<!-- Inactive Tab: Livraison -->
<div class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:bg-secondary-container rounded-full active:scale-90 transition-all duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
<span class="font-label-md text-label-md">Livraison</span>
</div>
<!-- Inactive Tab: Historique -->
<div class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:bg-secondary-container rounded-full active:scale-90 transition-all duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md">Historique</span>
</div>
</nav>
<script>
        // Micro-interaction for the markers
        document.querySelectorAll('.animate-pulse').forEach(marker => {
            marker.addEventListener('click', () => {
                alert('Détails du livreur en route vers votre zone.');
            });
        });

        // Simple scale effect on tap for the FAB
        const fab = document.querySelector('button');
        fab.addEventListener('touchstart', () => {
            fab.classList.add('scale-95');
        });
        fab.addEventListener('touchend', () => {
            fab.classList.remove('scale-95');
        });
    </script>
</body></html>
