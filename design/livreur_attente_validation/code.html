            animation: pulse-ring 3s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(.95); opacity: 0.8; }
        }

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top Navigation Anchor (As defined in JSON - Suppressed if Transactional, but used here as identity branding) -->
<nav class="w-full top-0 sticky flex items-center justify-between px-container-padding py-md bg-surface">
<div class="flex items-center gap-xs">
<span class="font-headline-md text-headline-md text-primary">WONA</span>
</div>
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-secondary-container">
<span class="material-symbols-outlined text-on-secondary-container">person</span>
</div>
</nav>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding text-center">
<!-- Status Illustration Section -->
<div class="relative mb-xl">
<!-- Decorative Circles for depth -->
<div class="absolute inset-0 bg-primary-container/10 rounded-full scale-150 blur-3xl"></div>
<div class="clock-pulse absolute inset-0 bg-primary-container/20 rounded-full scale-125"></div>
<!-- Central Icon Container -->
<div class="relative z-10 w-32 h-32 bg-primary-container rounded-full flex items-center justify-center shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-white text-[64px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
</div>
</div>
<!-- Messaging Content -->
<div class="max-w-xs space-y-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                Validation en cours
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
                Votre compte est en cours de validation par nos équipes. Vous recevrez une notification sous 24h.
            </p>
</div>
<!-- BENTO-INSPIRED DETAILS CARD (Modern UI Pattern) -->
<div class="mt-xl w-full max-w-sm bg-surface-container-low rounded-xl p-md flex items-center gap-md border border-outline-variant/30">
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-fixed-variant">verified_user</span>
</div>
<div class="text-left">
<p class="font-label-bold text-label-bold text-primary uppercase tracking-wider">Sécurité</p>
<p class="font-body-md text-body-md text-on-surface-variant">Nous vérifions vos documents pour garantir la sécurité de tous.</p>
</div>
</div>
</main>
<!-- Bottom Actions Area -->
<footer class="p-container-padding flex flex-col items-center gap-md mb-8">
<!-- Support Button (Secondary Ghost Style) -->
<button class="flex items-center gap-xs text-primary font-label-bold text-label-md px-lg py-sm rounded-full bg-secondary-fixed/50 hover:bg-secondary-fixed transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]">headset_mic</span>
            Contacter le support
        </button>
<!-- Illustration/Atmosphere (Using background image prompt) -->
<div class="w-full h-40 mt-md rounded-xl overflow-hidden opacity-80" data-alt="A clean, minimalist high-key photography of a modern workspace in a bright West African tech hub. Soft orange sunlight filters through a window onto a white desk with a laptop and a small green plant. The aesthetic is professional, airy, and trustworthy, using the brand's primary orange and white palette to evoke a sense of calm efficiency and modern logistics management." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC5j9VYJBQfgCeH03Fc8lzEQk6bBPFFPJ2UlgS4IUigLs1Lm7PArFpH1wzTTVtRtf7-xtUnHUULXN9mGp4vTUcVRZL5y6eb1TN5UpepVx_MHN2V_9cr4Pz7vm2OqdqaT23lJ4ywb-25VED2uO9G9kbBT_QitR28KeowRX8wS_SQexNRjufV42amt0qXkrKzg0ABkrQiUmS7x-wtjW7jSGbY9lds0bnh7PXwYLg1MNmMeTeZNuvb06Kc')">
</div>
</footer>
<!-- BottomNavBar (Suppressed for focused state per Destination Rule, but showing structure for completeness of the "Shell") -->
<!-- Not rendered as this is a focused 'Account Pending' transactional state -->
<script>
        // Micro-interaction: Subtle hover effect for the support button
        const supportBtn = document.querySelector('button');
        supportBtn.addEventListener('mouseenter', () => {
            supportBtn.classList.add('shadow-sm');
        });
        supportBtn.addEventListener('mouseleave', () => {
            supportBtn.classList.remove('shadow-sm');
        });
    </script>
