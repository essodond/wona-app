                    "secondary-fixed-dim": "#d1c4b7",

                    "surface-container-high": "#f9e4d9",

<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input:focus {
            border-color: #974800;
            box-shadow: 0 0 0 2px rgba(151, 72, 0, 0.1);
        }
        .numpad-key:active {
            transform: scale(0.92);
            background-color: #ebddd0;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar Navigation (Suppressed per Rules: Transactional Screen) -->
<header class="w-full top-0 sticky bg-surface flex items-center justify-between px-container-padding py-md z-50">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform" onclick="history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md-mobile text-primary">WONA</span>
<div class="w-6"></div> <!-- Spacer -->
</header>
<main class="flex-1 w-full max-w-md px-container-padding flex flex-col pt-lg">
<!-- Illustration Section -->
<div class="mb-xl flex justify-center">
<div class="w-24 h-24 bg-primary-container/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">sms</span>
</div>
</div>
<!-- Title & Instruction -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-base">Vérifiez votre code</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Nous avons envoyé un code de vérification à 6 chiffres au <span class="font-bold text-on-surface">+225 •• •• •• 89</span>.
            </p>
</div>
<!-- OTP Input Fields -->
<div class="flex justify-between gap-xs mb-lg" id="otp-container">
<input class="otp-input w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container rounded-xl border border-outline/20 focus:outline-none transition-all" maxlength="1" readonly="" type="number"/>
<input class="otp-input w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container rounded-xl border border-outline/20 focus:outline-none transition-all" maxlength="1" readonly="" type="number"/>
<input class="otp-input w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container rounded-xl border border-outline/20 focus:outline-none transition-all" maxlength="1" readonly="" type="number"/>
<input class="otp-input w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container rounded-xl border border-outline/20 focus:outline-none transition-all" maxlength="1" readonly="" type="number"/>
<input class="otp-input w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container rounded-xl border border-outline/20 focus:outline-none transition-all" maxlength="1" readonly="" type="number"/>
<input class="otp-input w-12 h-14 text-center text-headline-md font-headline-md bg-surface-container rounded-xl border border-outline/20 focus:outline-none transition-all" maxlength="1" readonly="" type="number"/>
</div>
<!-- Resend Section -->
<div class="text-center mb-xl">
<p class="font-label-md text-label-md text-on-surface-variant">
                Vous n'avez pas reçu de code ?
                <button class="text-primary font-label-bold ml-1 hover:underline active:opacity-70 transition-all" id="resend-btn">Renvoyer le code</button>
</p>
<p class="font-label-md text-label-md text-outline mt-1" id="timer">Attendez 00:59</p>
</div>
<!-- Verify Button -->
<button class="w-full h-14 bg-primary-container text-on-primary-container font-headline-md rounded-xl shadow-[0px_4px_12px_rgba(232,121,30,0.3)] active:scale-[0.98] transition-all flex items-center justify-center gap-sm" id="verify-btn">
<span>Vérifier</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</main>
<!-- Custom Numeric Keypad -->
<div class="w-full bg-surface-container-low px-container-padding pt-md pb-xl mt-auto border-t border-outline/5 select-none">
<div class="grid grid-cols-3 gap-y-4 max-w-md mx-auto">
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(1)">1</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(2)">2</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(3)">3</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(4)">4</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(5)">5</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(6)">6</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(7)">7</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(8)">8</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(9)">9</div>
<div class="flex items-center justify-center h-14"></div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-headline-md cursor-pointer transition-all" onclick="addNumber(0)">0</div>
<div class="numpad-key flex items-center justify-center h-14 rounded-xl text-on-surface-variant cursor-pointer transition-all" onclick="deleteNumber()">
<span class="material-symbols-outlined">backspace</span>
</div>
</div>
</div>
<script>
        const inputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verify-btn');
        let currentIdx = 0;

        function addNumber(num) {
            if (currentIdx < inputs.length) {
                inputs[currentIdx].value = num;
                inputs[currentIdx].classList.add('border-primary', 'bg-surface-bright');
                currentIdx++;
                checkCompletion();
            }
        }

        function deleteNumber() {
            if (currentIdx > 0) {
                currentIdx--;
                inputs[currentIdx].value = '';
                inputs[currentIdx].classList.remove('border-primary', 'bg-surface-bright');
                checkCompletion();
            }
        }

        function checkCompletion() {
            const isComplete = Array.from(inputs).every(input => input.value !== '');
            if (isComplete) {
                verifyBtn.classList.remove('opacity-50');
                verifyBtn.disabled = false;
            } else {
                verifyBtn.classList.add('opacity-50');
                verifyBtn.disabled = true;
            }
        }

        // Timer Logic
        let seconds = 59;
        const timerEl = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            if (seconds > 0) {
                seconds--;
                timerEl.innerText = `Attendez 00:${seconds < 10 ? '0' : ''}${seconds}`;
                resendBtn.style.opacity = '0.5';
                resendBtn.style.pointerEvents = 'none';
            } else {
                timerEl.innerText = '';
                resendBtn.style.opacity = '1';
                resendBtn.style.pointerEvents = 'auto';
                clearInterval(countdown);
            }
        }, 1000);

        // Verification Logic
        verifyBtn.addEventListener('click', () => {
            const code = Array.from(inputs).map(i => i.value).join('');
            verifyBtn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span>`;
            
            // Simulation
            setTimeout(() => {
                if(code === "123456") {
                    verifyBtn.innerHTML = `<span class="material-symbols-outlined">check_circle</span>`;
                    verifyBtn.classList.replace('bg-primary-container', 'bg-green-600');
                    alert("Code vérifié avec succès !");
                } else {
                    verifyBtn.innerHTML = `Vérifier`;
                    inputs.forEach(i => i.classList.add('border-error'));
                    setTimeout(() => inputs.forEach(i => i.classList.remove('border-error')), 2000);
                }
            }, 1500);
        });

        // Initialize button state
        checkCompletion();
    </script>
</body></html>
