<!-- Illustrative Floating Background Elements (Vanilla JS Micro-interaction) -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden" id="bubbles"></div>
<script>
        // Adding subtle floating particles to the background for brand energy
        const bubblesContainer = document.getElementById('bubbles');
        for (let i = 0; i < 6; i++) {
            const bubble = document.createElement('div');
            const size = Math.random() * 100 + 50;
            bubble.style.position = 'absolute';
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.backgroundColor = '#E8791E';
            bubble.style.opacity = '0.03';
            bubble.style.borderRadius = '50%';
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.top = `${Math.random() * 100}%`;
            bubble.style.filter = 'blur(40px)';
            bubblesContainer.appendChild(bubble);
            
            // Subtle animation
            bubble.animate([
                { transform: 'translate(0, 0)' },
                { transform: `translate(${Math.random() * 50 - 25}px, ${Math.random() * 50 - 25}px)` }
            ], {
                duration: 5000 + Math.random() * 5000,
                iterations: Infinity,
                direction: 'alternate',
                easing: 'ease-in-out'
            });
        }
    </script>
