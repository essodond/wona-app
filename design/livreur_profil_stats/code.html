</div>
<div class="absolute -bottom-1 -right-1 bg-primary text-white p-1 rounded-full border-2 border-white">

</div>
<div class="flex flex-col gap-xs">

<!-- Premium Badge -->

<!-- Stats Bento-style Grid -->

</a>

<script>
        // Micro-interaction: Active ripple effect on buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;
                const ripple = document.createElement('span');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.classList.add('absolute', 'w-2', 'h-2', 'bg-white/20', 'rounded-full', 'animate-ping');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
