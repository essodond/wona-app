<div class="flex-grow">
<p class="font-headline-md text-headline-md leading-tight">450 m</p>
<p class="font-body-md text-body-md opacity-90">Tournez à droite sur l'Avenue Jean-Paul II</p>
</div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Colis récupéré
            </button>

<!-- Micro-interaction Script -->
<script>
        document.getElementById('mainActionButton').addEventListener('click', function() {
            this.classList.add('scale-95', 'opacity-80');
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> En cours...';
            
            setTimeout(() => {
                this.classList.remove('scale-95', 'opacity-80', 'bg-primary-container');
                this.classList.add('bg-tertiary', 'text-on-tertiary');
                this.innerHTML = '<span class="material-symbols-outlined">local_shipping</span> En route vers la livraison';
                
                // Animate progress bar to 100%
                const progressBar = document.querySelector('.bg-primary-container.h-full');
                progressBar.style.width = '100%';
            }, 1200);
        });

        // Pulsing animation for GPS current location marker would go here in a real app
    </script>
